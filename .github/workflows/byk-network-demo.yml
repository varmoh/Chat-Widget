# Bürokrati võrgustiku demo: ehitab vidina pildi ja laeb selle ghcr-i (ghcr.io/<omanik>/chat-widget:byk-network-demo).
# Lisab byk-demo/forks/prepare.sh widget --push forgi harusse .github/workflows/. Käivitub push'iga harusse
# byk-network-demo või käsitsi (Actions -> byk-network-demo -> Run workflow).
# env-config.js võetakse praegusest vidina pildist (WIDGET_BASE_IMAGE): nginx serveerib seda pildist.
name: byk-network-demo
on:
  push:
    branches: [byk-network-demo]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  WIDGET_BASE_IMAGE: ghcr.io/buerokratt/chat-widget:pre-alpha-test-3.3.17
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: env-config.js praegusest pildist
        run: |
          docker pull "$WIDGET_BASE_IMAGE"
          cid=$(docker create "$WIDGET_BASE_IMAGE")
          docker cp "$cid:/usr/share/nginx/html/widget/env-config.js" public/env-config.js
          docker rm "$cid"
          grep -oE '[A-Z_]+_URL[^,]*' public/env-config.js | head -8 || true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Owner lowercase
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/chat-widget:byk-network-demo
            ghcr.io/${{ env.OWNER }}/chat-widget:byk-network-demo-${{ github.run_number }}
